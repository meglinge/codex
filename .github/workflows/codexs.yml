# CI for codexs (codex-rs/codexs): an OpenAI-compatible HTTP API served by
# in-process Codex sessions.
#
# Builds release binaries for Linux (x86_64 glibc) and Windows (x86_64 MSVC),
# uploads them as workflow artifacts, and - when the ref is a tag such as
# `codexs-v0.153.4` - publishes a GitHub release with the archives and the
# install scripts attached.
#
# Versioning follows the official Codex CLI: the tag's version must be an
# official openai/codex release version. It is stamped into the workspace
# `version` before building, so `codexs --version`, `clientInfo.version` and
# the `codex_cli_rs/<version>` User-Agent all match the official CLI. Branch
# builds use the latest official release version.
#
#   git tag codexs-v0.153.4 && git push fork codexs-v0.153.4

name: codexs

on:
  push:
    branches:
      - codexs
    tags:
      - "codexs-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # bwrap is built (and hashed) in its own step before the main build.
            binaries: "codexs codex-code-mode-host"
          # windows-2025: setup-ci provisions a Dev Drive, which windows-2022 lacks.
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binaries: "codexs codex-code-mode-host codex-command-runner codex-windows-sandbox-setup"
    defaults:
      run:
        working-directory: codex-rs
        shell: bash

    steps:
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.longpaths true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve official Codex version and stamp the workspace
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#codexs-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "tag must look like codexs-vX.Y.Z (an official openai/codex version)" >&2; exit 1; }
          else
            version="$(gh release list -R openai/codex --exclude-pre-releases --limit 30 --json tagName \
              --jq '[.[] | select(.tagName | startswith("rust-v"))][0].tagName')"
            version="${version#rust-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "could not resolve the latest openai/codex release (got '$version')" >&2; exit 1; }
          fi
          # Same stamping the official release pipeline does: every workspace
          # crate (and therefore the User-Agent / clientInfo) reports it.
          sed -i.bak "s/^version = \"0.0.0\"\$/version = \"${version}\"/" Cargo.toml && rm -f Cargo.toml.bak
          grep -q "^version = \"${version}\"\$" Cargo.toml || { echo "failed to stamp version" >&2; exit 1; }
          echo "codexs version: ${version} (codex commit $(git rev-parse --short HEAD))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /

      # Dev Drive + CARGO_TARGET_DIR on Windows, unprivileged userns on Linux.
      - uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      # aws-lc-sys needs NASM for its assembly on Windows MSVC.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          cache-targets: false
          shared-key: codexs-${{ matrix.target }}

      # setup-rusty-v8 runs a Python script that needs tomllib (3.11+);
      # ubuntu-22.04 ships 3.10.
      - name: Install Python 3.12 (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # codex-code-mode-host links V8; use the prebuilt archives from the
      # upstream openai/codex `rusty-v8-v*` releases instead of building V8.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build bwrap and export digest (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release --bin bwrap
          bwrap_path="$CARGO_TARGET_DIR/${target}/release/bwrap"
          [[ -f "$bwrap_path" ]] || { echo "bwrap not found at $bwrap_path" >&2; exit 1; }
          # Codex embeds this digest at build time and verifies the bundled
          # bwrap next to the executable before using it.
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "Built bwrap with sha256:${digest}"

      - name: Cargo build
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          if [[ "$target" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          build_args=()
          for binary in ${{ matrix.binaries }}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target "$target" --release "${build_args[@]}"

      - name: Stage archive
        id: stage
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          release_dir="$CARGO_TARGET_DIR/${target}/release"
          version="${{ steps.ver.outputs.version }}"

          name="codexs-${version}-${target}"
          dist="${GITHUB_WORKSPACE}/dist"
          stage="${dist}/${name}"
          mkdir -p "$stage"

          ext=""
          [[ "$target" == *windows* ]] && ext=".exe"
          for binary in ${{ matrix.binaries }}; do
            cp "${release_dir}/${binary}${ext}" "$stage/"
          done
          if [[ "$target" == *linux* ]]; then
            cp "${release_dir}/bwrap" "$stage/"
            for binary in ${{ matrix.binaries }}; do
              strip --strip-debug --strip-unneeded "$stage/${binary}"
            done
          fi
          cp codexs/codexs.example.toml codexs/README.md "$stage/"

          "$stage/codexs${ext}" --version

          cd "$dist"
          if [[ "$target" == *windows* ]]; then
            archive="${name}.zip"
            7z a -tzip "$archive" "$name" >/dev/null
          else
            archive="${name}.tar.gz"
            tar -czf "$archive" "$name"
          fi
          rm -rf "$name"
          ls -lh "$dist"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-${{ matrix.target }}
          path: dist/${{ steps.stage.outputs.archive }}
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          pattern: codexs-*
          path: dist
          merge-multiple: true

      - name: Add install scripts and checksums
        id: notes
        run: |
          set -euo pipefail
          cp codex-rs/codexs/install.sh codex-rs/codexs/install.ps1 dist/
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          version="${GITHUB_REF_NAME#codexs-v}"
          {
            echo "codexs ${version} - OpenAI-compatible API served by in-process Codex."
            echo
            echo "Built from openai/codex \`$(git rev-parse --short HEAD)\` (branch \`codexs\`)."
            echo "Reports Codex version \`${version}\` (\`codexs --version\`, \`clientInfo.version\`, \`codex_cli_rs/${version}\` User-Agent)."
            echo
            echo "Install:"
            echo
            echo '```'
            echo "# Linux"
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/codexs/codex-rs/codexs/install.sh | CODEXS_VERSION=${version} bash"
            echo
            echo "# Windows (PowerShell)"
            echo "\$env:CODEXS_VERSION='${version}'; irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/codexs/codex-rs/codexs/install.ps1 | iex"
            echo '```'
          } > ../release-notes.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: codexs v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: dist/*
