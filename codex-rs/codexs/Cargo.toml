[package]
name = "codexs"
workspace = ".."
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI-compatible HTTP API (Responses + Chat Completions) served by real in-process Codex sessions, with client tools bridged as Codex dynamic tools."

[[bin]]
name = "codexs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true, default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { workspace = true, features = ["derive"] }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
codex-cloud-config = { workspace = true }
codex-config = { workspace = true }
codex-core = { workspace = true }
codex-feedback = { workspace = true }
codex-login = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-absolute-path = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs"] }
tokio-stream = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v4"] }
