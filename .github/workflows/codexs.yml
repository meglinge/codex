# CI for codexs (codex-rs/codexs): an OpenAI-compatible HTTP API served by
# in-process Codex sessions.
#
# Builds the Linux (x86_64 glibc) release binaries, uploads them as a workflow
# artifact, and - when the ref is a tag such as `codexs-v0.153.4` - publishes a
# GitHub release with the archive and the install script attached.
#
# Versioning follows the official Codex CLI: the tag's version must be an
# official openai/codex release version. It is stamped into the workspace
# `version` before building, so `codexs --version`, `clientInfo.version` and
# the `codex_cli_rs/<version>` User-Agent all match the official CLI. Branch
# builds use the latest official release version.
#
#   git tag codexs-v0.153.4 && git push fork codexs-v0.153.4
#
# A rebuild of the same official version gets a build suffix:
# `codexs-v0.153.4-2` still stamps/reports 0.153.4, only the release tag differs.

name: codexs

on:
  push:
    branches:
      - codexs
    tags:
      - "codexs-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  TARGET: x86_64-unknown-linux-gnu
  # bwrap is built (and hashed) in its own step before the main build.
  BINARIES: "codexs codex-code-mode-host"

jobs:
  build:
    name: Build - x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
        shell: bash

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve official Codex version and stamp the workspace
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#codexs-v}"
            version="${version%%-*}"   # drop a build suffix (codexs-v0.153.4-2 -> 0.153.4)
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "tag must look like codexs-vX.Y.Z[-N] (X.Y.Z an official openai/codex version)" >&2; exit 1; }
          else
            version="$(gh release list -R openai/codex --exclude-pre-releases --limit 30 --json tagName \
              --jq '[.[] | select(.tagName | startswith("rust-v"))][0].tagName')"
            version="${version#rust-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "could not resolve the latest openai/codex release (got '$version')" >&2; exit 1; }
          fi
          # Same stamping the official release pipeline does: every workspace
          # crate (and therefore the User-Agent / clientInfo) reports it.
          sed -i.bak "s/^version = \"0.0.0\"\$/version = \"${version}\"/" Cargo.toml && rm -f Cargo.toml.bak
          grep -q "^version = \"${version}\"\$" Cargo.toml || { echo "failed to stamp version" >&2; exit 1; }
          echo "codexs version: ${version} (codex commit $(git rev-parse --short HEAD))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /

      # CARGO_TARGET_DIR, unprivileged userns, dotslash/just.
      - uses: ./.github/actions/setup-ci

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          cache-targets: false
          shared-key: codexs-${{ env.TARGET }}

      # setup-rusty-v8 runs a Python script that needs tomllib (3.11+);
      # ubuntu-22.04 ships 3.10.
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # codex-code-mode-host links V8; use the prebuilt archives from the
      # upstream openai/codex `rusty-v8-v*` releases instead of building V8.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ env.TARGET }}

      - name: Build bwrap and export digest
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --release --bin bwrap
          bwrap_path="$CARGO_TARGET_DIR/${TARGET}/release/bwrap"
          [[ -f "$bwrap_path" ]] || { echo "bwrap not found at $bwrap_path" >&2; exit 1; }
          # Codex embeds this digest at build time and verifies the bundled
          # bwrap next to the executable before using it.
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "Built bwrap with sha256:${digest}"

      - name: Cargo build
        run: |
          set -euo pipefail
          build_args=()
          for binary in $BINARIES; do
            build_args+=(--bin "$binary")
          done
          cargo build --target "$TARGET" --release "${build_args[@]}"

      - name: Stage archive
        id: stage
        run: |
          set -euo pipefail
          release_dir="$CARGO_TARGET_DIR/${TARGET}/release"
          version="${{ steps.ver.outputs.version }}"

          name="codexs-${version}-${TARGET}"
          dist="${GITHUB_WORKSPACE}/dist"
          stage="${dist}/${name}"
          mkdir -p "$stage"

          for binary in $BINARIES; do
            cp "${release_dir}/${binary}" "$stage/"
            strip --strip-debug --strip-unneeded "$stage/${binary}"
          done
          cp "${release_dir}/bwrap" "$stage/"
          cp codexs/codexs.example.toml codexs/README.md "$stage/"

          "$stage/codexs" --version

          cd "$dist"
          archive="${name}.tar.gz"
          tar -czf "$archive" "$name"
          rm -rf "$name"
          ls -lh "$dist"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codexs-${{ env.TARGET }}
          path: dist/${{ steps.stage.outputs.archive }}
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          pattern: codexs-*
          path: dist
          merge-multiple: true

      - name: Add install script and checksums
        id: notes
        run: |
          set -euo pipefail
          cp codex-rs/codexs/install.sh dist/
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          version="${GITHUB_REF_NAME#codexs-v}"
          version="${version%%-*}"
          {
            echo "codexs ${GITHUB_REF_NAME#codexs-v} - OpenAI-compatible API served by in-process Codex (Linux x86_64)."
            echo
            echo "Built from openai/codex \`$(git rev-parse --short HEAD)\` (branch \`codexs\`)."
            echo "Reports Codex version \`${version}\` (\`codexs --version\`, \`clientInfo.version\`, \`codex_cli_rs/${version}\` User-Agent)."
            echo
            echo "Install:"
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/codexs/codex-rs/codexs/install.sh | CODEXS_VERSION=${GITHUB_REF_NAME#codexs-v} bash"
            echo '```'
            echo
            echo "One account per instance: \`codexs server --port 8790 --proxy socks5h://127.0.0.1:1080 --codex-home ~/.codex\` (see \`codexs server --help\`)."
          } > ../release-notes.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: codexs v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: dist/*
